# Run Scorecard for this repository to further check and harden software and process.

name: Scorecards supply-chain security
on:
  # Only the default branch is supported.
  branch_protection_rule:
  schedule:
  - cron: 27 20 * * 1
  push:
    branches: [main]

# Declare default permissions as read only.
permissions: read-all

jobs:
  analyze-scorecard:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      actions: read
      contents: read
      # Needed to access OIDC token.
      id-token: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
        disable-sudo: true

    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run analysis
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        # Read-only PAT token. To create it,
        # follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat-optional.
        repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}
        # Publish the results to enable scorecard badges. For more details, see
        # https://github.com/ossf/scorecard-action#publishing-results.
        # For private repositories, `publish_results` will automatically be set to `false`,
        # regardless of the value entered here.
        publish_results: true

    # Upload the results as artifacts (optional).
    - name: Upload artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: SARIF file
        path: results.sarif

    # Upload the results to GitHub's code scanning dashboard.
    - name: Upload to code-scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: results.sarif
